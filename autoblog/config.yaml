# ===== サイト設定 =====
# iPhone だけで運用する場合、このファイルは編集しなくてOK。
# GitHub の Settings → Secrets and variables → Actions → 「Variables」タブで
# SITE_TITLE / NICHE / RAKUTEN_AFFILIATE_ID などを入力すると、ここの値より優先される。
site:
  title: "買い時ウォッチ"
  description: "人気の家電・ゲーム機・日用品の楽天市場での最安値を毎日記録。価格推移のグラフと実データで「今が買い時か」を判定します。"
  # 空なら GitHub Pages の URL（https://ユーザー名.github.io/リポジトリ名）を自動で使う
  base_url: ""
  author: "編集部"
  # 独自ドメインを使う場合だけ設定（例: kaidoki.example.com）
  custom_domain: ""
  # Google Search Console の所有権確認タグ（変数 GSC_VERIFICATION にタグを丸ごと貼ってもOK）
  gsc_verification: ""

# 追跡する商品のジャンル。AIはこの範囲で人気商品を探して追加する
niche: "楽天市場で人気の家電・ゲーム機・美容家電・食品（米など）・日用品のうち、価格が変動しやすく最安値を調べられやすいもの"

# ===== 収益化 =====
monetize:
  # 楽天アフィリエイトID。設定すると商品リンクが自動でアフィリエイトリンクになる（変数 RAKUTEN_AFFILIATE_ID でも可）
  rakuten_affiliate_id: ""

# ===== 生成設定 =====
generate:
  # 追跡する商品数の上限（楽天APIは1秒1回なので100件程度まで余裕）
  max_products: 100
  # 1日にAIが追加する商品数（楽天で実在を確認できたものだけ追加される）
  add_per_run: 3
  # 1日にAIが書く商品解説の数
  notes_per_run: 2
  # 上から順に試し、APIキー/トークンがないもの・失敗したものは飛ばす。
  # 初期状態は無料のものだけで動く（github は登録不要、gemini は無料キーを登録すると使われる）
  providers:
    - name: gemini            # 無料枠。https://aistudio.google.com/apikey でキー発行（カード不要）
      model: "gemini-flash-latest"
      max_tokens: 8000
    - name: github            # 無料。GitHub Actions 上なら設定不要（1日の回数制限あり）
      model: "openai/gpt-4.1-mini"
      max_tokens: 4000
    # 有料の Claude を使う場合は下の3行のコメントを外し、ANTHROPIC_API_KEY を登録して先頭に移動する
    # - name: anthropic
    #   model: "claude-opus-5-5"
    #   effort: "medium"
