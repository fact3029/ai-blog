name: AI 自動ブログ

on:
  schedule:
    - cron: "17 22 * * *"   # UTC 22:17 = JST 7:17 に毎日1回
  workflow_dispatch:
    inputs:
      add_topics:
        description: "書いてほしいテーマ（任意・複数は「、」区切り）。次の記事から優先して使われる"
        type: string
        default: ""
      generate:
        description: "記事を生成する（オフならテーマ追加とサイト更新だけ）"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write
  models: read   # GitHub Models（無料AI）を GITHUB_TOKEN で使うため

concurrency:
  group: autoblog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: autoblog
    # iPhone から Settings → Secrets and variables → Actions → Variables で入力した設定
    env:
      SITE_TITLE: ${{ vars.SITE_TITLE }}
      SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION }}
      NICHE: ${{ vars.NICHE }}
      BASE_URL: ${{ vars.BASE_URL }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
      AMAZON_TAG: ${{ vars.AMAZON_TAG }}
      RAKUTEN_AFFILIATE_ID: ${{ vars.RAKUTEN_AFFILIATE_ID }}
      ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autoblog/requirements.txt

      - run: pip install -r requirements.txt

      - name: テーマを追加
        if: inputs.add_topics != ''
        env:
          ADD_TOPICS: ${{ inputs.add_topics }}
        run: python -c "import generate as g; c, k = g.read_keywords(); g.add_topics(c, k)"

      - name: 記事を生成
        if: github.event_name == 'schedule' || inputs.generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}           # 無料（設定不要）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}       # 無料（任意）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 有料（任意）
        run: python generate.py

      - name: 生成した記事をコミット
        run: |
          git config user.name "autoblog-bot"
          git config user.email "autoblog-bot@users.noreply.github.com"
          git add posts keywords.txt
          git diff --cached --quiet || git commit -m "autoblog: 新しい記事を追加"
          git push

      - run: python build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: autoblog/_site
      - id: deploy
        uses: actions/deploy-pages@v4
