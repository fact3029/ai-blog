name: 買い時ウォッチ（価格記録と公開）

on:
  schedule:
    - cron: "17 21 * * *"   # UTC 21:17 = JST 6:17 に毎日1回
  workflow_dispatch:
    inputs:
      add_products:
        description: "追跡したい商品名（任意・複数は「、」区切り）。楽天で見つかったものだけ追加"
        type: string
        default: ""
      run_ai:
        description: "AIによる商品追加・解説作成を行う"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write
  models: read   # GitHub Models（無料AI）を GITHUB_TOKEN で使うため

concurrency:
  group: autoblog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: autoblog
    # iPhone から Settings → Secrets and variables → Actions で入力した設定
    env:
      SITE_TITLE: ${{ vars.SITE_TITLE }}
      SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION }}
      NICHE: ${{ vars.NICHE }}
      BASE_URL: ${{ vars.BASE_URL }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
      RAKUTEN_AFFILIATE_ID: ${{ vars.RAKUTEN_AFFILIATE_ID }}
      ADD_PER_RUN: ${{ vars.ADD_PER_RUN }}
      MAX_PRODUCTS: ${{ vars.MAX_PRODUCTS }}
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autoblog/requirements.txt

      - run: pip install -r requirements.txt

      - name: AIで商品を追加・解説を作成
        if: github.event_name == 'schedule' || inputs.run_ai || inputs.add_products != ''
        env:
          ADD_PRODUCTS: ${{ inputs.add_products }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}           # 無料（設定不要）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}       # 無料（任意）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 有料（任意）
        run: python generate.py

      - name: 楽天の価格を記録
        run: python tracker.py

      - name: 記録をコミット
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A data notes watchlist.yaml
          git diff --cached --quiet || git commit -m "価格を記録: $(TZ=Asia/Tokyo date +%F)"
          git push

      - run: python build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: autoblog/_site
      - id: deploy
        uses: actions/deploy-pages@v4
